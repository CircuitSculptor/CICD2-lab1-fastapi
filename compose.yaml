services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/app.db"
    volumes:
      - user_data:/data

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    ports:
      - "8001:8001"

volumes:
  user_data: